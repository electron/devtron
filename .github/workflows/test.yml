name: Test

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        electron-version:
          - 36
          - 37
          - 38
          - 39
          - 40
          - 41
          - 42
          - 43
        node-version:
          - '22.12.x'
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: "${{ matrix.os }}"
    steps:
      - run: git config --global core.autocrlf input
      - name: Configure ubuntu
        if: contains(matrix.os, 'ubuntu')
        shell: bash
        run: |-
          # Setup a virtual display for Electron tests
          sudo apt install -y xvfb
          sudo Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

          # Workaround for Electron AppImage apps failing to initialize on Ubuntu due to AppArmor restrictions
          # Disables unprivileged user namespaces restriction to allow Electron apps to run
          # Reference: https://github.com/electron/electron/issues/42510
                     : https://github.com/electron-userland/electron-builder/issues/8440
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "${{ matrix.node-version }}"
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
        env:
          ELECTRON_PKG: electron${{ matrix.electron-version }}

  required-ci:
    needs:
      - test
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "One or more required jobs did not succeed:"
          echo "  test: $TEST_RESULT"
          exit 1
      - name: We are done
        run: echo "Hello World"
